<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>俳優 好き顔9選</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff7fa;
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

button {
  font-family: inherit;
}

.hidden {
  display: none !important;
}


/* =========================
   START
========================= */

#startScreen {

  min-height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;

  text-align: center;

  padding: 20px;
}

.startBox {
  width: 100%;
  max-width: 500px;
}

.logoText {

  font-size: 13px;

  letter-spacing: 5px;

  color: #999;

  margin-bottom: 15px;
}

h1 {

  margin: 0;

  font-size: 32px;

  letter-spacing: 2px;
}

.startDescription {

  margin: 20px 0 30px;

  line-height: 1.8;

  color: #666;
}

.startButton {

  border: none;

  background: #333;

  color: white;

  padding: 16px 60px;

  border-radius: 999px;

  font-size: 16px;

  cursor: pointer;
}


/* =========================
   GAME
========================= */

#gameScreen {

  max-width: 700px;

  margin: auto;

  padding: 20px 14px 40px;
}

.topArea {

  text-align: center;

  margin-bottom: 20px;
}

.phase {

  font-size: 12px;

  color: #999;

  letter-spacing: 2px;
}

.questionTitle {

  font-size: 22px;

  font-weight: bold;

  margin-top: 8px;
}

.progress {

  font-size: 13px;

  color: #999;

  margin-top: 7px;
}


/* =========================
   SEARCH
========================= */

.searchBox {

  margin: 15px 0;
}

.searchBox input {

  width: 100%;

  border: 1px solid #ddd;

  border-radius: 999px;

  padding: 12px 17px;

  font-size: 14px;

  outline: none;

  background: white;
}


/* =========================
   ACTORS
========================= */

.actorGrid {

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 12px;
}

.actorCard {

  position: relative;

  background: white;

  border: 3px solid transparent;

  border-radius: 16px;

  overflow: hidden;

  box-shadow:
    0 3px 12px rgba(0,0,0,0.07);

  cursor: pointer;

  transition: 0.15s;
}

.actorCard.selected {

  border-color: #ff6f91;

  transform: translateY(-2px);
}

.actorCard.selected::after {

  content: "✓";

  position: absolute;

  top: 8px;

  right: 8px;

  width: 30px;

  height: 30px;

  border-radius: 50%;

  background: #ff6f91;

  color: white;

  display: flex;

  align-items: center;

  justify-content: center;

  font-weight: bold;
}

.actorImage {

  width: 100%;

  aspect-ratio: 1 / 1;

  object-fit: cover;

  display: block;
}

.actorName {

  text-align: center;

  font-size: 14px;

  font-weight: bold;

  padding: 10px 5px;
}


/* =========================
   NEXT
========================= */

.nextArea {

  margin-top: 22px;

  text-align: center;
}

.nextButton {

  width: 100%;

  max-width: 360px;

  border: none;

  border-radius: 999px;

  padding: 15px;

  background: #ff6f91;

  color: white;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;
}

.nextButton:disabled {

  background: #ddd;

  color: #999;

  cursor: not-allowed;
}

.nextNotice {

  margin-top: 9px;

  font-size: 12px;

  color: #999;
}


/* =========================
   RESULT
========================= */

#resultScreen {

  max-width: 700px;

  margin: auto;

  padding: 30px 14px 50px;
}

.resultHeader {

  text-align: center;

  margin-bottom: 25px;
}

.resultHeader h2 {

  margin: 0;

  font-size: 28px;
}

.resultHeader p {

  color: #999;
}

.resultGrid {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 10px;
}

.resultCard {

  background: white;

  border-radius: 12px;

  overflow: hidden;

  box-shadow:
    0 3px 10px rgba(0,0,0,0.08);
}

.resultCard img {

  width: 100%;

  aspect-ratio: 1 / 1;

  object-fit: cover;

  display: block;
}

.resultRank {

  text-align: center;

  font-size: 11px;

  color: #999;

  padding-top: 7px;
}

.resultName {

  text-align: center;

  font-weight: bold;

  font-size: 12px;

  padding: 8px 3px;
}

.restartButton {

  display: block;

  margin: 28px auto 0;

  border: none;

  background: #333;

  color: white;

  padding: 14px 35px;

  border-radius: 999px;

  cursor: pointer;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

  h1 {
    font-size: 27px;
  }

  .questionTitle {
    font-size: 20px;
  }

  .actorGrid {
    gap: 9px;
  }

  .actorName {
    font-size: 13px;
  }
}

</style>

</head>


<body>


<!-- =================================================
     START
================================================= -->

<section id="startScreen">

  <div class="startBox">

    <div class="logoText">
      MY FAVORITE
    </div>

    <h1>
      俳優 好き顔9選
    </h1>

    <p class="startDescription">

      たくさんの俳優の中から<br>

      「顔が好き！」と思う人を<br>

      直感で選んでね♡

    </p>

    <button
      class="startButton"
      onclick="startGame()"
    >
      START
    </button>

  </div>

</section>



<!-- =================================================
     GAME
================================================= -->

<section
  id="gameScreen"
  class="hidden"
>

  <div class="topArea">

    <div
      id="phaseText"
      class="phase"
    >
      予選
    </div>

    <div
      id="questionTitle"
      class="questionTitle"
    >
      好きな顔を選んでね♡
    </div>

    <div
      id="progressText"
      class="progress"
    >
      0人選択中
    </div>

  </div>


  <!-- 検索 -->

  <div class="searchBox">

    <input
      id="searchInput"
      type="text"
      placeholder="🔍 俳優を検索"
      oninput="searchActors()"
    >

  </div>


  <!-- 俳優 -->

  <div
    id="actorGrid"
    class="actorGrid"
  ></div>


  <div class="nextArea">

    <button
      id="nextButton"
      class="nextButton"
      onclick="nextStep()"
      disabled
    >
      次へ
    </button>

    <div class="nextNotice">
      1人以上選んでね♡
    </div>

  </div>

</section>



<!-- =================================================
     RESULT
================================================= -->

<section
  id="resultScreen"
  class="hidden"
>

  <div class="resultHeader">

    <h2>
      あなたの好き顔9選♡
    </h2>

    <p>
      顔だけで選んだTOP9
    </p>

  </div>


  <div
    id="resultGrid"
    class="resultGrid"
  ></div>


  <button
    class="restartButton"
    onclick="location.reload()"
  >
    もう一度やる
  </button>

</section>



<script>

/* =================================================
   データ
================================================= */

let actors = [];


/*
  選択回数

  例：

  山﨑賢人 → 5
  吉沢亮 → 3
*/

let selectionCounts = {};


/*
  現在の候補
*/

let currentChoices = [];


/*
  今の画面で選んだ人
*/

let currentSelected = [];


/*
  現在のラウンド
*/

let roundNumber = 0;


/*
  予選の画面数

  テスト用。

  本番では俳優数に合わせて
  自動調整する。
*/

const PRELIMINARY_ROUNDS = 8;


/* =================================================
   シャッフル
================================================= */

function shuffle(array) {

  const result = [...array];

  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      result[i],
      result[j]
    ] =
    [
      result[j],
      result[i]
    ];
  }

  return result;
}


/* =================================================
   データ読み込み
================================================= */

async function loadActors() {

  const response =
    await fetch("actors.json");

  actors =
    await response.json();


  /*
    全員の選択回数を0にする
  */

  actors.forEach(actor => {

    selectionCounts[
      actor.id
    ] = 0;

  });

}


/* =================================================
   START
================================================= */

async function startGame() {

  try {

    await loadActors();

  } catch (error) {

    alert(
      "actors.jsonを読み込めませんでした。"
    );

    console.error(error);

    return;
  }


  if (actors.length < 2) {

    alert(
      "俳優を2人以上登録してください。"
    );

    return;
  }


  document
    .getElementById("startScreen")
    .classList.add("hidden");


  document
    .getElementById("gameScreen")
    .classList.remove("hidden");


  roundNumber = 0;

  showNextRound();

}


/* =================================================
   次の予選
================================================= */

function showNextRound() {

  roundNumber++;

  currentSelected = [];


  /*
    毎回シャッフルする。

    つまり actors.json の順番は
    表示順にならない。
  */

  const shuffled =
    shuffle(actors);


  /*
    4人表示。

    ただし3人しか残っていない場合は3人。
  */

  currentChoices =
    shuffled.slice(
      0,
      Math.min(4, actors.length)
    );


  document
    .getElementById("phaseText")
    .textContent =
    "予選  " +
    roundNumber;


  document
    .getElementById("questionTitle")
    .textContent =
    "この中で好きな顔を選んでね♡";


  document
    .getElementById("searchInput")
    .value = "";


  renderActors();

  updateSelectionDisplay();

}


/* =================================================
   俳優表示
================================================= */

function renderActors(list = currentChoices) {

  const grid =
    document.getElementById("actorGrid");

  grid.innerHTML = "";


  list.forEach(actor => {

    const card =
      document.createElement("div");


    card.className =
      "actorCard";


    if (
      currentSelected.some(
        selected =>
          selected.id === actor.id
      )
    ) {

      card.classList.add("selected");

    }


    card.innerHTML = `

      <img
        class="actorImage"
        src="${actor.image}"
        alt="${actor.name}"
        loading="lazy"
      >

      <div class="actorName">
        ${actor.name}
      </div>

    `;


    card.addEventListener(
      "click",
      () => {

        toggleActor(
          actor,
          card
        );

      }
    );


    grid.appendChild(card);

  });

}


/* =================================================
   選択
================================================= */

function toggleActor(
  actor,
  card
) {

  const index =
    currentSelected.findIndex(
      selected =>
        selected.id === actor.id
    );


  /*
    選択済みなら解除
  */

  if (index !== -1) {

    currentSelected.splice(
      index,
      1
    );

    card.classList.remove(
      "selected"
    );

  }


  /*
    未選択なら追加
  */

  else {

    currentSelected.push(actor);

    card.classList.add(
      "selected"
    );

  }


  updateSelectionDisplay();

}


/* =================================================
   選択人数
================================================= */

function updateSelectionDisplay() {

  const count =
    currentSelected.length;


  document
    .getElementById("progressText")
    .textContent =
    count + "人選択中";


  /*
    0人なら次へ不可
  */

  document
    .getElementById("nextButton")
    .disabled =
    count === 0;

}


/* =================================================
   次へ
================================================= */

function nextStep() {

  /*
    0人なら進めない
  */

  if (
    currentSelected.length === 0
  ) {

    alert(
      "最低1人は選んでね♡"
    );

    return;
  }


  /*
    選んだ人の回数を増やす
  */

  currentSelected.forEach(
    actor => {

      selectionCounts[
        actor.id
      ]++;

    }
  );


  /*
    予選終了
  */

  if (
    roundNumber >=
    PRELIMINARY_ROUNDS
  ) {

    finishPreliminary();

    return;
  }


  /*
    次のランダム候補
  */

  showNextRound();

}


/* =================================================
   検索
================================================= */

function searchActors() {

  const keyword =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  /*
    空欄なら現在の4人に戻す
  */

  if (keyword === "") {

    renderActors();

    return;
  }


  /*
    名前から検索

    ※検索しても選考対象そのものを
    変更するわけではない。
  */

  const results =
    actors.filter(
      actor =>
        actor.name
          .toLowerCase()
          .includes(keyword)
    );


  renderActors(results);

}


/* =================================================
   予選終了
================================================= */

function finishPreliminary() {

  /*
    選択回数順に並べる

    同点の場合はランダム
  */

  const ranking =
    [...actors].sort(
      (a, b) => {

        const diff =
          selectionCounts[b.id] -
          selectionCounts[a.id];

        if (diff !== 0) {

          return diff;

        }

        return Math.random() - 0.5;

      }
    );


  /*
    ここではテスト用に
    上位12人を次の段階へ。
  */

  const candidates =
    ranking.slice(
      0,
      Math.min(12, ranking.length)
    );


  /*
    次の段階へ

    本格版ではここから

    4人
    ↓
    3人
    ↓
    2人
    ↓
    決勝
    ↓
    TOP9

    にしていく。
  */

  startSecondRound(
    candidates
  );

}


/* =================================================
   第2段階
================================================= */

let secondRoundActors = [];

let secondRoundIndex = 0;

let secondRoundSelected = [];


function startSecondRound(
  candidates
) {

  secondRoundActors =
    candidates;

  secondRoundIndex = 0;

  secondRoundSelected = [];


  document
    .getElementById("phaseText")
    .textContent =
    "STEP 2";


  showSecondRoundGroup();

}


/* =================================================
   STEP2
================================================= */

function showSecondRoundGroup() {

  /*
    12人から3人ずつ出す
  */

  const group =
    secondRoundActors.slice(
      secondRoundIndex,
      secondRoundIndex + 3
    );


  /*
    全部終わったら結果へ

    ※ここは後で本格的な
    2人比較に変更する。
  */

  if (group.length === 0) {

    finishGame();

    return;
  }


  currentChoices =
    group;

  currentSelected = [];


  document
    .getElementById("questionTitle")
    .textContent =
    "この中から好きな顔を選んでね♡";


  renderActors();

  updateSelectionDisplay();


  /*
    次の3人へ
  */

  secondRoundIndex += 3;

}


/* =================================================
   STEP2 → 次
================================================= */

function finishGame() {

  /*
    最終的にはここを
    本格的な2択決勝にする。

    現在はテストとして
    選択回数順にTOP9を作る。
  */

  const ranking =
    [...actors].sort(
      (a, b) => {

        return (
          selectionCounts[b.id] -
          selectionCounts[a.id]
        );

      }
    );


  const result =
    ranking.slice(
      0,
      Math.min(9, ranking.length)
    );


  showResult(result);

}


/* =================================================
   結果
================================================= */

function showResult(
  result
) {

  document
    .getElementById("gameScreen")
    .classList.add("hidden");


  document
    .getElementById("resultScreen")
    .classList.remove("hidden");


  const grid =
    document.getElementById("resultGrid");


  grid.innerHTML = "";


  result.forEach(
    (actor, index) => {

      const card =
        document.createElement("div");


      card.className =
        "resultCard";


      card.innerHTML = `

        <div class="resultRank">
          NO.${index + 1}
        </div>

        <img
          src="${actor.image}"
          alt="${actor.name}"
        >

        <div class="resultName">
          ${actor.name}
        </div>

      `;


      grid.appendChild(card);

    }
  );

}

</script>

</body>

</html>
