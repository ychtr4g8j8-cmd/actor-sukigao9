<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>俳優 好き顔9選</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff7fa;
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

button {
  font-family: inherit;
}

.hidden {
  display: none !important;
}


/* =========================
   START
========================= */

#startScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

.startBox {
  width: 100%;
  max-width: 500px;
}

.logoText {
  font-size: 13px;
  letter-spacing: 5px;
  color: #999;
  margin-bottom: 15px;
}

h1 {
  margin: 0;
  font-size: 32px;
  letter-spacing: 2px;
}

.startDescription {
  margin: 20px 0 30px;
  line-height: 1.8;
  color: #666;
}

.startButton {
  border: none;
  background: #333;
  color: white;
  padding: 16px 60px;
  border-radius: 999px;
  font-size: 16px;
  cursor: pointer;
}


/* =========================
   GAME
========================= */

#gameScreen {
  max-width: 700px;
  margin: auto;
  padding: 20px 14px 40px;
}

.topArea {
  text-align: center;
  margin-bottom: 20px;
}

.phase {
  font-size: 12px;
  color: #999;
  letter-spacing: 2px;
}

.questionTitle {
  font-size: 22px;
  font-weight: bold;
  margin-top: 8px;
}

.progress {
  font-size: 13px;
  color: #999;
  margin-top: 7px;
}


/* =========================
   SEARCH
========================= */

.searchBox {
  margin: 15px 0;
}

.searchBox input {
  width: 100%;
  border: 1px solid #ddd;
  border-radius: 999px;
  padding: 12px 17px;
  font-size: 14px;
  outline: none;
  background: white;
}


/* =========================
   ACTORS
========================= */

.actorGrid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.actorCard {
  position: relative;
  background: white;
  border: 3px solid transparent;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 3px 12px rgba(0,0,0,0.07);
  cursor: pointer;
  transition: 0.15s;
}

.actorCard.selected {
  border-color: #ff6f91;
  transform: translateY(-2px);
}

.actorCard.selected::after {
  content: "✓";
  position: absolute;
  top: 8px;
  right: 8px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: #ff6f91;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.actorImage {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  display: block;
}

.actorName {
  text-align: center;
  font-size: 14px;
  font-weight: bold;
  padding: 10px 5px;
}


/* =========================
   NEXT
========================= */

.nextArea {
  margin-top: 22px;
  text-align: center;
}

.nextButton {
  width: 100%;
  max-width: 360px;
  border: none;
  border-radius: 999px;
  padding: 15px;
  background: #ff6f91;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.nextButton:disabled {
  background: #ddd;
  color: #999;
  cursor: not-allowed;
}

.nextNotice {
  margin-top: 9px;
  font-size: 12px;
  color: #999;
}


/* =========================
   RESULT
========================= */

#resultScreen {
  max-width: 700px;
  margin: auto;
  padding: 30px 14px 50px;
}

.resultHeader {
  text-align: center;
  margin-bottom: 25px;
}

.resultHeader h2 {
  margin: 0;
  font-size: 28px;
}

.resultHeader p {
  color: #999;
}

.resultGrid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.resultCard {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.resultCard img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  display: block;
}

.resultRank {
  text-align: center;
  font-size: 11px;
  color: #999;
  padding-top: 7px;
}

.resultName {
  text-align: center;
  font-weight: bold;
  font-size: 12px;
  padding: 8px 3px;
}

.restartButton {
  display: block;
  margin: 28px auto 0;
  border: none;
  background: #333;
  color: white;
  padding: 14px 35px;
  border-radius: 999px;
  cursor: pointer;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

  h1 {
    font-size: 27px;
  }

  .questionTitle {
    font-size: 20px;
  }

  .actorGrid {
    gap: 9px;
  }

  .actorName {
    font-size: 13px;
  }

}

</style>

</head>


<body>


<!-- =========================
     START
========================= -->

<section id="startScreen">

  <div class="startBox">

    <div class="logoText">
      MY FAVORITE
    </div>

    <h1>
      俳優 好き顔9選
    </h1>

    <p class="startDescription">

      たくさんの俳優の中から<br>

      「顔が好き！」と思う人を<br>

      直感で選んでね♡

    </p>

    <button
      class="startButton"
      onclick="startGame()"
    >
      START
    </button>

  </div>

</section>


<!-- =========================
     GAME
========================= -->

<section
  id="gameScreen"
  class="hidden"
>

  <div class="topArea">

    <div
      id="phaseText"
      class="phase"
    >
      予選
    </div>

    <div
      id="questionTitle"
      class="questionTitle"
    >
      好きな顔を選んでね♡
    </div>

    <div
      id="progressText"
      class="progress"
    >
      0人選択中
    </div>

  </div>


  <div class="searchBox">

    <input
      id="searchInput"
      type="text"
      placeholder="🔍 俳優を検索"
      oninput="searchActors()"
    >

  </div>


  <div
    id="actorGrid"
    class="actorGrid"
  ></div>


  <div class="nextArea">

    <button
      id="nextButton"
      class="nextButton"
      onclick="nextStep()"
      disabled
    >
      次へ
    </button>

    <div class="nextNotice">
      1人以上選んでね♡
    </div>

  </div>

</section>


<!-- =========================
     RESULT
========================= -->

<section
  id="resultScreen"
  class="hidden"
>

  <div class="resultHeader">

    <h2>
      あなたの好き顔9選♡
    </h2>

    <p>
      顔だけで選んだTOP9
    </p>

  </div>

  <div
    id="resultGrid"
    class="resultGrid"
  ></div>

  <button
    class="restartButton"
    onclick="location.reload()"
  >
    もう一度やる
  </button>

</section>


<script>

/* =================================================
   基本データ
================================================= */

let actors = [];


/* 予選で選ばれた回数 */

let preliminaryCounts = {};


/* 本戦で選ばれた回数 */

let mainCounts = {};


/* 決勝で勝った回数 */

let finalWins = {};


/* 今表示している俳優 */

let currentChoices = [];


/* 今選んでいる俳優 */

let currentSelected = [];


/* 今のフェーズ */

let phase = "preliminary";


/* 予選で一度でも表示された俳優 */

let preliminarySeen = new Set();


/* 本戦候補 */

let mainCandidates = [];


/* 本戦の表示回数 */

let mainRound = 0;


/* 決勝候補 */

let finalCandidates = [];


/* 決勝の比較 */

let finalPairs = [];


/* 決勝で現在比較しているペア */

let currentPairIndex = 0;


/* 決勝の順位用スコア */

let finalScores = {};


/* =================================================
   シャッフル
================================================= */

function shuffle(array) {

  const result = [...array];

  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      result[i],
      result[j]
    ] =
    [
      result[j],
      result[i]
    ];

  }

  return result;

}


/* =================================================
   データ読み込み
================================================= */

async function loadActors() {

  const response =
    await fetch("actors.json");

  if (!response.ok) {

    throw new Error(
      "actors.jsonが読み込めません"
    );

  }

  actors =
    await response.json();


  if (!Array.isArray(actors)) {

    throw new Error(
      "actors.jsonの形式が正しくありません"
    );

  }


  preliminaryCounts = {};
  mainCounts = {};
  finalWins = {};
  finalScores = {};


  actors.forEach(actor => {

    preliminaryCounts[actor.id] = 0;
    mainCounts[actor.id] = 0;
    finalWins[actor.id] = 0;
    finalScores[actor.id] = 0;

  });

}


/* =================================================
   START
================================================= */

async function startGame() {

  try {

    await loadActors();

  } catch (error) {

    alert(
      "actors.jsonを読み込めませんでした。"
    );

    console.error(error);

    return;

  }


  if (actors.length < 2) {

    alert(
      "俳優を2人以上登録してください。"
    );

    return;

  }


  document
    .getElementById("startScreen")
    .classList.add("hidden");

  document
    .getElementById("gameScreen")
    .classList.remove("hidden");


  phase = "preliminary";

  preliminarySeen = new Set();

  currentSelected = [];

  showPreliminaryRound();

}


/* =================================================
   予選
================================================= */

function showPreliminaryRound() {

  currentSelected = [];


  /*
    まだ一度も出ていない俳優を優先する。

    その中から最大4人。
  */

  const unseen =
    shuffle(
      actors.filter(
        actor =>
          !preliminarySeen.has(actor.id)
      )
    );


  let choices =
    unseen.slice(
      0,
      Math.min(4, actors.length)
    );


  /*
    未登場の俳優が4人未満なら、
    すでに登場した俳優も混ぜる。

    これによって同じ人が
    もう一度出ることがある。
  */

  if (choices.length < 4) {

    const remaining =
      shuffle(
        actors.filter(
          actor =>
            !choices.some(
              c => c.id === actor.id
            )
        )
      );


    choices =
      choices.concat(
        remaining.slice(
          0,
          4 - choices.length
        )
      );

  }


  currentChoices = choices;


  /*
    表示された人を記録
  */

  currentChoices.forEach(
    actor => {
      preliminarySeen.add(actor.id);
    }
  );


  document
    .getElementById("phaseText")
    .textContent =
    "予選";


  document
    .getElementById("questionTitle")
    .textContent =
    "この中で好きな顔を選んでね♡";


  document
    .getElementById("progressText")
    .textContent =
    preliminarySeen.size +
    " / " +
    actors.length +
    "人 登場済み";


  document
    .getElementById("searchInput")
    .value = "";


  renderActors();

  updateSelectionDisplay();

}


/* =================================================
   本戦へ進むか確認
================================================= */

function checkPreliminaryFinished() {

  return (
    preliminarySeen.size >= actors.length
  );

}


/* =================================================
   本戦開始
================================================= */

function startMainRound() {

  phase = "main";

  currentSelected = [];


  /*
    予選の選択回数順に並べる。

    同点ならランダム。
  */

  const ranking =
    [...actors].sort(
      (a, b) => {

        const diff =
          preliminaryCounts[b.id] -
          preliminaryCounts[a.id];

        if (diff !== 0) {

          return diff;

        }

        return Math.random() - 0.5;

      }
    );


  /*
    本戦は最大12人。

    16人なら12人。

    500人なら12人。
  */

  mainCandidates =
    ranking.slice(
      0,
      Math.min(12, ranking.length)
    );


  mainRound = 0;


  /*
    本戦候補の選択回数をリセット
  */

  mainCandidates.forEach(
    actor => {
      mainCounts[actor.id] = 0;
    }
  );


  showMainRound();

}


/* =================================================
   本戦
================================================= */

function showMainRound() {

  currentSelected = [];


  /*
    本戦候補から4人をランダム表示。

    何回か繰り返す。
  */

  const shuffled =
    shuffle(mainCandidates);


  currentChoices =
    shuffled.slice(
      0,
      Math.min(4, mainCandidates.length)
    );


  mainRound++;


  document
    .getElementById("phaseText")
    .textContent =
    "本戦";


  document
    .getElementById("questionTitle")
    .textContent =
    "この中から好きな顔を選んでね♡";


  document
    .getElementById("progressText")
    .textContent =
    "本戦 " +
    mainRound +
    "回目";


  document
    .getElementById("searchInput")
    .value = "";


  renderActors();

  updateSelectionDisplay();

}


/* =================================================
   決勝開始
================================================= */

function startFinal() {

  phase = "final";


  /*
    本戦の結果で並べる。

    上位9人を決勝候補にする。
  */

  const ranking =
    [...mainCandidates].sort(
      (a, b) => {

        const diff =
          mainCounts[b.id] -
          mainCounts[a.id];

        if (diff !== 0) {

          return diff;

        }

        return Math.random() - 0.5;

      }
    );


  finalCandidates =
    ranking.slice(
      0,
      Math.min(9, ranking.length)
    );


  /*
    決勝用スコアを0にする
  */

  finalCandidates.forEach(
    actor => {

      finalScores[actor.id] = 0;
      finalWins[actor.id] = 0;

    }
  );


  /*
    9人ならランダムに
    2人ずつ比較する。

    各人が複数回比較される。
  */

  finalPairs = [];


  const shuffled =
    shuffle(finalCandidates);


  for (
    let i = 0;
    i < shuffled.length;
    i++
  ) {

    for (
      let j = i + 1;
      j < shuffled.length;
      j++
    ) {

      finalPairs.push([
        shuffled[i],
        shuffled[j]
      ]);

    }

  }


  finalPairs =
    shuffle(finalPairs);


  currentPairIndex = 0;


  showFinalPair();

}


/* =================================================
   決勝 2択
================================================= */

function showFinalPair() {

  if (
    currentPairIndex >=
    finalPairs.length
  ) {

    finishFinal();

    return;

  }


  currentSelected = [];


  const pair =
    finalPairs[currentPairIndex];


  currentChoices = pair;


  document
    .getElementById("phaseText")
    .textContent =
    "決勝";


  document
    .getElementById("questionTitle")
    .textContent =
    "どっちの顔が好き？♡";


  document
    .getElementById("progressText")
    .textContent =
    "2人から1人選んでね";


  document
    .getElementById("searchInput")
    .value = "";


  renderActors();

  updateSelectionDisplay();

}


/* =================================================
   俳優表示
================================================= */

function renderActors(
  list = currentChoices
) {

  const grid =
    document.getElementById("actorGrid");


  grid.innerHTML = "";


  list.forEach(actor => {

    const card =
      document.createElement("div");


    card.className =
      "actorCard";


    if (
      currentSelected.some(
        selected =>
          selected.id === actor.id
      )
    ) {

      card.classList.add("selected");

    }


    card.innerHTML = `

      <img
        class="actorImage"
        src="${actor.image}"
        alt="${actor.name}"
        loading="lazy"
      >

      <div class="actorName">
        ${actor.name}
      </div>

    `;


    card.addEventListener(
      "click",
      () => {

        toggleActor(
          actor,
          card
        );

      }
    );


    grid.appendChild(card);

  });

}


/* =================================================
   選択
================================================= */

function toggleActor(
  actor,
  card
) {

  /*
    決勝は必ず1人だけ。

    予選・本戦は複数選択OK。
  */

  if (phase === "final") {

    currentSelected = [actor];


    document
      .querySelectorAll(".actorCard")
      .forEach(
        c => c.classList.remove("selected")
      );


    card.classList.add("selected");


    updateSelectionDisplay();

    return;

  }


  const index =
    currentSelected.findIndex(
      selected =>
        selected.id === actor.id
    );


  if (index !== -1) {

    currentSelected.splice(
      index,
      1
    );

    card.classList.remove(
      "selected"
    );

  }

  else {

    currentSelected.push(actor);

    card.classList.add(
      "selected"
    );

  }


  updateSelectionDisplay();

}


/* =================================================
   選択表示
================================================= */

function updateSelectionDisplay() {

  const count =
    currentSelected.length;


  if (phase === "preliminary") {

    document
      .getElementById("progressText")
      .textContent =
      preliminarySeen.size +
      " / " +
      actors.length +
      "人 登場済み";

  }


  document
    .getElementById("nextButton")
    .disabled =
    count === 0;

}


/* =================================================
   次へ
================================================= */

function nextStep() {

  if (
    currentSelected.length === 0
  ) {

    alert(
      "最低1人は選んでね♡"
    );

    return;

  }


  /* =========================
     予選
  ========================= */

  if (phase === "preliminary") {

    currentSelected.forEach(
      actor => {

        preliminaryCounts[
          actor.id
        ]++;

      }
    );


    /*
      全員が一度以上登場したら
      本戦へ。
    */

    if (
      checkPreliminaryFinished()
    ) {

      startMainRound();

      return;

    }


    showPreliminaryRound();

    return;

  }


  /* =========================
     本戦
  ========================= */

  if (phase === "main") {

    currentSelected.forEach(
      actor => {

        mainCounts[
          actor.id
        ]++;

      }
    );


    /*
      本戦を一定回数行う。

      12人なら6回。

      俳優数が変わっても
      ある程度自動調整。
    */

    const mainLimit =
      Math.max(
        6,
        Math.ceil(
          mainCandidates.length * 0.5
        )
      );


    if (
      mainRound >= mainLimit
    ) {

      startFinal();

      return;

    }


    showMainRound();

    return;

  }


  /* =========================
     決勝
  ========================= */

  if (phase === "final") {

    const winner =
      currentSelected[0];


    finalScores[
      winner.id
    ]++;


    finalWins[
      winner.id
    ]++;


    currentPairIndex++;


    showFinalPair();

  }

}


/* =================================================
   検索
================================================= */

function searchActors() {

  const keyword =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  /*
    空欄なら現在の候補へ
  */

  if (keyword === "") {

    renderActors();

    return;

  }


  /*
    全俳優から検索。

    検索結果を表示するだけ。

    ここから選択することもできる。
  */

  const results =
    actors.filter(
      actor =>
        actor.name
          .toLowerCase()
          .includes(keyword)
    );


  renderActors(results);

}


/* =================================================
   最終結果
================================================= */

function finishFinal() {

  /*
    決勝の勝利数で順位を決定。

    同点の場合は本戦結果を参考にする。
  */

  const ranking =
    [...finalCandidates].sort(
      (a, b) => {

        const finalDiff =
          finalScores[b.id] -
          finalScores[a.id];


        if (finalDiff !== 0) {

          return finalDiff;

        }


        const mainDiff =
          mainCounts[b.id] -
          mainCounts[a.id];


        if (mainDiff !== 0) {

          return mainDiff;

        }


        return Math.random() - 0.5;

      }
    );


  showResult(
    ranking.slice(
      0,
      Math.min(9, ranking.length)
    )
  );

}


/* =================================================
   結果表示
================================================= */

function showResult(result) {

  document
    .getElementById("gameScreen")
    .classList.add("hidden");


  document
    .getElementById("resultScreen")
    .classList.remove("hidden");


  const grid =
    document.getElementById("resultGrid");


  grid.innerHTML = "";


  result.forEach(
    (actor, index) => {

      const card =
        document.createElement("div");


      card.className =
        "resultCard";


      card.innerHTML = `

        <div class="resultRank">
          NO.${index + 1}
        </div>

        <img
          src="${actor.image}"
          alt="${actor.name}"
        >

        <div class="resultName">
          ${actor.name}
        </div>

      `;


      grid.appendChild(card);

    }
  );

}

</script>

</body>

</html>
