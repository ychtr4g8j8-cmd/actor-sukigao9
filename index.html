<div class="container">


  <h1>

         検索

      </h2>

        id="searchInput"

      >

        id="searchResults"

      ></div>

  >

    </div>

    <button
      class="restart-button"
      onclick="location.reload()"
    >
      もう一度やる
    </button>

  </div>

<script>


/* =====================================================
   基本設定
===================================================== */


/*
予選で一度に表示する人数
*/

const PRELIMINARY_SIZE = 9;


/*
本戦で一度に表示する人数
*/

const MAIN_DISPLAY_SIZE = 4;


/*
本戦候補を最終的に何人くらい残すか。

人数に応じて自動計算するので、
俳優を増やしてもここは基本変更不要。
*/

const MAIN_CANDIDATE_RATIO = 0.25;


/*
本戦で1人あたり
平均何回くらい登場させるか。
*/

const MAIN_APPEARANCES_PER_ACTOR = 2.2;


/*
決勝に進める人数。

基本12人。
*/

const FINAL_CANDIDATE_SIZE = 12;


/*
予選の再登場。

0人が一番多く、
1人がたまに、
2人はかなり少ない。

3人以上は絶対なし。
*/

const REPEAT_0_PROBABILITY = 70;
const REPEAT_1_PROBABILITY = 28;
const REPEAT_2_PROBABILITY = 2;



/* =====================================================
   状態
===================================================== */

let actors = [];


let currentPhase =
  "preliminary";


let currentChoices = [];


let selectedIds =
  new Set();


/*
予選で一度でも表示された人
*/

let preliminarySeen =
  new Set();


/*
予選で選ばれた回数
*/

let preliminaryCounts =
  new Map();


/*
本戦で選ばれた回数
*/

let mainCounts =
  new Map();


/*
本戦で表示された回数
*/

let mainAppearances =
  new Map();


/*
直前の本戦画面に出た人
*/

let lastMainChoices =
  new Set();


/*
決勝で勝った回数
*/

let finalWins =
  new Map();


/*
予選の画面数
*/

let preliminaryRound = 0;


/*
本戦の画面数
*/

let mainRound = 0;


/*
本戦の総画面数
*/

let mainTotalRounds = 0;


/*
本戦候補
*/

let mainCandidates = [];


/*
決勝候補
*/

let finalCandidates = [];


/*
決勝の対戦カード
*/

let finalPairs = [];


/*
決勝の現在位置
*/

let finalPairIndex = 0;



/* =====================================================
   JSON読み込み
===================================================== */

async function loadActors() {

  try {

    const response =
      await fetch("actors.json");


    if (!response.ok) {

      throw new Error(
        "actors.jsonを読み込めませんでした"
      );

    }


    actors =
      await response.json();


    if (
      !Array.isArray(actors) ||
      actors.length === 0
    ) {

      throw new Error(
        "actors.jsonに俳優がありません"
      );

    }


    /*
    各俳優の数値を初期化
    */

    actors.forEach(actor => {

      preliminaryCounts.set(
        actor.id,
        0
      );


      mainCounts.set(
        actor.id,
        0
      );


      mainAppearances.set(
        actor.id,
        0
      );


      finalWins.set(
        actor.id,
        0
      );

    });


    startPreliminary();


  } catch (error) {

    console.error(error);


    document.getElementById(
      "actorGrid"
    ).innerHTML = `

      <p style="
        text-align:center;
        grid-column:1/-1;
      ">
        actors.jsonを読み込めませんでした。
      </p>

    `;

  }

}



/* =====================================================
   ランダム
===================================================== */

function shuffle(array) {

  const result =
    [...array];


  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );


    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];

  }


  return result;

}


function randomPick(
  array,
  count
) {

  return shuffle(array)
    .slice(0, count);

}



/* =====================================================
   予選の再登場人数
===================================================== */

function getRepeatCount() {

  const random =
    Math.random() * 100;


  if (
    random <
    REPEAT_0_PROBABILITY
  ) {

    return 0;

  }


  if (
    random <
    REPEAT_0_PROBABILITY +
    REPEAT_1_PROBABILITY
  ) {

    return 1;

  }


  return 2;

}



/* =====================================================
   予選開始
===================================================== */


/*
予選の基本方針：

「まだ出ていない俳優を最優先」

ただし、新規が十分残っている場合は、
低確率で既出の俳優を1〜2人混ぜる。


そのため、

・新規9人
・新規8人＋再登場1人
・新規7人＋再登場2人

などが発生する。


ただし再登場はかなり少ない。


そして最終的には、
全員が最低1回は登場する。
*/

function startPreliminary() {

  currentPhase =
    "preliminary";


  preliminaryRound++;


  selectedIds.clear();


  const displaySize =
    Math.min(
      PRELIMINARY_SIZE,
      actors.length
    );


  /*
  まだ一度も出ていない俳優
  */

  const unseen =
    actors.filter(
      actor =>
        !preliminarySeen.has(
          actor.id
        )
    );


  /*
  すでに出た俳優
  */

  const seen =
    actors.filter(
      actor =>
        preliminarySeen.has(
          actor.id
        )
    );


  let repeatCount = 0;


  /*
  新規が十分いるときだけ
  再登場抽選をする。

  これによって
  全員を見ることを優先する。
  */

  if (
    seen.length > 0 &&
    unseen.length >= displaySize
  ) {

    repeatCount =
      getRepeatCount();

  }


  /*
  再登場は最大2人
  */

  repeatCount =
    Math.min(
      repeatCount,
      2,
      seen.length
    );


  /*
  新規人数
  */

  let newCount =
    Math.min(
      displaySize - repeatCount,
      unseen.length
    );


  /*
  新規俳優
  */

  const newActors =
    randomPick(
      unseen,
      newCount
    );


  /*
  足りない分だけ既出から補充
  */

  const remaining =
    displaySize -
    newActors.length;


  const repeatActors =
    randomPick(
      seen,
      remaining
    );


  /*
  9人を作る
  */

  currentChoices =
    shuffle([
      ...newActors,
      ...repeatActors
    ]);


  /*
  表示された人を
  登場済みにする
  */

  currentChoices.forEach(
    actor => {

      preliminarySeen.add(
        actor.id
      );

    }
  );


  renderPreliminary();

}



/* =====================================================
   予選画面
===================================================== */

function renderPreliminary() {

  document.getElementById(
    "phaseTitle"
  ).textContent =
    "予選";


  document.getElementById(
    "phaseDescription"
  ).textContent =
    "気になる俳優を好きなだけ選んでください";


  document.getElementById(
    "progress"
  ).textContent =
    `予選 ${preliminaryRound}`;


  renderActors();


  document.getElementById(
    "nextButton"
  ).textContent =
    "次へ";

}



/* =====================================================
   予選終了
===================================================== */

function finishPreliminaryRound() {

  /*
  選択された俳優の
  「好き」回数を増やす。

  ここでは選択した順番を
  一切記録しない。
  */

  selectedIds.forEach(
    id => {

      preliminaryCounts.set(
        id,
        (preliminaryCounts.get(id) || 0) + 1
      );

    }
  );


  /*
  全員が最低1回登場したか
  */

  const allSeen =
    actors.every(
      actor =>
        preliminarySeen.has(
          actor.id
        )
    );


  /*
  まだ出ていない人がいれば
  予選続行
  */

  if (!allSeen) {

    startPreliminary();

    return;

  }


  /*
  全員見たら本戦候補を作る
  */

  prepareMain();

}



/* =====================================================
   本戦候補を作る
===================================================== */


/*
予選の選択回数を使って
本戦へ進む人を絞る。


ただし単純に
「上位だけ」に固定しない。


同じくらいの選択回数の人は
少しランダム性を持たせる。
*/

function prepareMain() {

  /*
  予選選択回数を取得
  */

  const scored =
    actors.map(actor => ({

      actor: actor,

      score:
        preliminaryCounts.get(
          actor.id
        ) || 0

    }));


  /*
  選択回数が多い順
  */

  scored.sort(
    (a, b) =>
      b.score - a.score
  );


  /*
  本戦候補人数。


  100人
  → 約25人


  500人
  → 約125人


  1000人
  → 約250人


  のように自動。
  */

  let candidateCount =
    Math.ceil(
      actors.length *
      MAIN_CANDIDATE_RATIO
    );


  /*
  最低18人
  */

  candidateCount =
    Math.max(
      candidateCount,
      18
    );


  /*
  俳優が少ない場合
  全員を超えないようにする
  */

  candidateCount =
    Math.min(
      candidateCount,
      actors.length
    );


  /*
  同じ選択回数の人たちを
  完全固定にしないため、
  スコアに小さなランダム値を足す。
  */

  const randomized =
    scored.map(item => ({

      actor: item.actor,

      score:
        item.score * 100 +
        Math.random() * 20

    }));


  randomized.sort(
    (a, b) =>
      b.score - a.score
  );


  mainCandidates =
    randomized
      .slice(
        0,
        candidateCount
      )
      .map(
        item => item.actor
      );


  /*
  本戦の回数を人数に応じて自動計算。

  候補人数 × 2.2回
  ÷ 4人表示

  という考え方。
  */

  mainTotalRounds =
    Math.max(
      8,
      Math.ceil(
        mainCandidates.length *
        MAIN_APPEARANCES_PER_ACTOR /
        MAIN_DISPLAY_SIZE
      )
    );


  mainRound = 0;


  /*
  本戦開始
  */

  startMain();

}



/* =====================================================
   本戦で表示する4人を選ぶ
===================================================== */


/*
本戦では、
単純な完全ランダムにはしない。


・選択回数が多い人
  → 少し優先


・まだあまり表示されていない人
  → 出やすくする


・直前に出た人
  → できるだけ避ける


というバランス。
*/

function chooseMainActors() {

  const candidates =
    [...mainCandidates];


  /*
  直前に出た人を除いた候補
  */

  let available =
    candidates.filter(
      actor =>
        !lastMainChoices.has(
          actor.id
        )
    );


  /*
  4人確保できない場合は
  全候補を使う
  */

  if (
    available.length <
    MAIN_DISPLAY_SIZE
  ) {

    available =
      candidates;

  }


  /*
  各候補に重みをつける
  */

  const scored =
    available.map(actor => {

      const selectionCount =
        mainCounts.get(
          actor.id
        ) || 0;


      const appearanceCount =
        mainAppearances.get(
          actor.id
        ) || 0;


      /*
      選ばれた回数が多いほど
      少し優先。


      でも表示回数が多いほど
      出にくくする。


      これによって
      「好きな人が何度も出続ける」
      のを防ぐ。
      */

      const weight =
        1 +
        selectionCount * 1.5 +
        Math.random() * 3 -
        appearanceCount * 0.8;


      return {

        actor,

        weight:
          Math.max(
            0.1,
            weight
          )

      };

    });


  /*
  重み付きで4人選ぶ
  */

  const result = [];


  while (
    result.length <
      Math.min(
        MAIN_DISPLAY_SIZE,
        scored.length
      )
  ) {

    let totalWeight =
      scored.reduce(
        (sum, item) =>
          sum + item.weight,
        0
      );


    let random =
      Math.random() *
      totalWeight;


    let chosenIndex = 0;


    for (
      let i = 0;
      i < scored.length;
      i++
    ) {

      random -=
        scored[i].weight;


      if (
        random <= 0
      ) {

        chosenIndex = i;

        break;

      }

    }


    result.push(
      scored[chosenIndex].actor
    );


    scored.splice(
      chosenIndex,
      1
    );

  }


  return shuffle(result);

}



/* =====================================================
   本戦開始
===================================================== */

function startMain() {

  currentPhase =
    "main";


  mainRound++;


  selectedIds.clear();


  /*
  4人を選ぶ
  */

  currentChoices =
    chooseMainActors();


  /*
  表示回数を記録
  */

  currentChoices.forEach(
    actor => {

      mainAppearances.set(
        actor.id,
        (mainAppearances.get(
          actor.id
        ) || 0) + 1
      );

    }
  );


  /*
  次回はできるだけ
  同じ4人を避ける
  */

  lastMainChoices =
    new Set(
      currentChoices.map(
        actor => actor.id
      )
    );


  renderMain();

}



/* =====================================================
   本戦画面
===================================================== */

function renderMain() {

  document.getElementById(
    "phaseTitle"
  ).textContent =
    "本戦";


  document.getElementById(
    "phaseDescription"
  ).textContent =
    "この4人の中から、好きな人を選んでください";


  document.getElementById(
    "progress"
  ).textContent =
    `本戦 ${mainRound} / ${mainTotalRounds}`;


  renderActors();


  document.getElementById(
    "nextButton"
  ).textContent =
    "次へ";

}



/* =====================================================
   本戦終了
===================================================== */

function finishMainRound() {

  /*
  選ばれた人だけ
  本戦ポイントを加算
  */

  selectedIds.forEach(
    id => {

      mainCounts.set(
        id,
        (mainCounts.get(id) || 0) + 1
      );

    }
  );


  /*
  本戦がまだ残っている
  */

  if (
    mainRound <
    mainTotalRounds
  ) {

    /*
    本戦の途中で
    徐々に候補を絞る。


    1/3地点
    2/3地点
    で絞る。
    */

    const firstCut =
      Math.ceil(
        mainTotalRounds / 3
      );


    const secondCut =
      Math.ceil(
        mainTotalRounds * 2 / 3
      );


    if (
      mainRound === firstCut ||
      mainRound === secondCut
    ) {

      narrowMainCandidates();

    }


    startMain();

    return;

  }


  /*
  本戦終了時にも
  最終的に絞る。
  */

  narrowMainCandidates();


  /*
  決勝へ
  */

  prepareFinal();

}



/* =====================================================
   本戦候補を絞る
===================================================== */


/*
本戦での選択回数を
強く評価。


予選の選択回数も
少しだけ残す。


ただし完全固定ではなく、
同点付近にはランダム性を入れる。
*/

function narrowMainCandidates() {

  const scored =
    mainCandidates.map(
      actor => {

        const mainScore =
          mainCounts.get(
            actor.id
          ) || 0;


        const prelimScore =
          preliminaryCounts.get(
            actor.id
          ) || 0;


        const score =
          mainScore * 4 +
          prelimScore;


        return {

          actor,

          score:
            score +
            Math.random() * 1.5

        };

      }
    );


  scored.sort(
    (a, b) =>
      b.score - a.score
  );


  /*
  現在人数の約70%を残す。


  例：

  100人
  ↓
  25人

  25人
  ↓
  18人

  18人
  ↓
  13人


  のように徐々に減る。
  */

  let keepCount =
    Math.ceil(
      scored.length * 0.7
    );


  /*
  最低12人
  */

  keepCount =
    Math.max(
      keepCount,
      FINAL_CANDIDATE_SIZE
    );


  /*
  多すぎないように
  */

  keepCount =
    Math.min(
      keepCount,
      scored.length
    );


  mainCandidates =
    scored
      .slice(
        0,
        keepCount
      )
      .map(
        item => item.actor
      );

}



/* =====================================================
   決勝候補を作る
===================================================== */

function prepareFinal() {

  /*
  本戦候補を最終評価
  */

  const scored =
    mainCandidates.map(
      actor => {

        const mainScore =
          mainCounts.get(
            actor.id
          ) || 0;


        const prelimScore =
          preliminaryCounts.get(
            actor.id
          ) || 0;


        /*
        本戦を一番重視。

        予選は補助。
        */

        const score =
          mainScore * 5 +
          prelimScore;


        return {

          actor,

          score:
            score +
            Math.random() * 2

        };

      }
    );


  scored.sort(
    (a, b) =>
      b.score - a.score
  );


  /*
  基本12人。

  人数が少なければ
  その人数まで。
  */

  const candidateCount =
    Math.min(
      FINAL_CANDIDATE_SIZE,
      scored.length
    );


  finalCandidates =
    scored
      .slice(
        0,
        candidateCount
      )
      .map(
        item => item.actor
      );


  /*
  決勝の勝利数を初期化
  */

  finalCandidates.forEach(
    actor => {

      finalWins.set(
        actor.id,
        0
      );

    }
  );


  /*
  2人ずつ全組み合わせで対戦。

  12人なら66試合。

  これによって
  「最後にたまたま1回勝っただけ」
  ではなく、
  全体的な強さを見る。
  */

  finalPairs = [];


  for (
    let i = 0;
    i < finalCandidates.length;
    i++
  ) {

    for (
      let j = i + 1;
      j < finalCandidates.length;
      j++
    ) {

      finalPairs.push([

        finalCandidates[i],

        finalCandidates[j]

      ]);

    }

  }


  finalPairs =
    shuffle(finalPairs);


  finalPairIndex = 0;


  startFinal();

}



/* =====================================================
   決勝開始
===================================================== */

function startFinal() {

  currentPhase =
    "final";


  selectedIds.clear();


  /*
  すべての対戦が終わったら
  結果へ
  */

  if (
    finalPairIndex >=
    finalPairs.length
  ) {

    showResult();

    return;

  }


  currentChoices =
    finalPairs[
      finalPairIndex
    ];


  renderFinal();

}



/* =====================================================
   決勝画面
===================================================== */

function renderFinal() {

  document.getElementById(
    "phaseTitle"
  ).textContent =
    "決勝";


  document.getElementById(
    "phaseDescription"
  ).textContent =
    "2人のうち、より好きな方を選んでください";


  document.getElementById(
    "progress"
  ).textContent =
    `決勝 ${finalPairIndex + 1} / ${finalPairs.length}`;


  const grid =
    document.getElementById(
      "actorGrid"
    );


  grid.className =
    "actor-grid final-choice";


  grid.innerHTML = "";


  currentChoices.forEach(
    actor => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "actor-card";


      card.dataset.id =
        actor.id;


      const img =
        document.createElement(
          "img"
        );


      img.src =
        actor.image ||
        `https://placehold.co/500x500?text=${encodeURIComponent(actor.name)}`;


      img.alt =
        actor.name;


      img.onerror =
        function() {

          this.src =
            `https://placehold.co/500x500?text=${encodeURIComponent(actor.name)}`;

        };


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "actor-name";


      name.textContent =
        actor.name;


      card.appendChild(img);

      card.appendChild(name);


      card.addEventListener(
        "click",
        () => {

          selectActor(
            actor.id
          );

        }
      );


      grid.appendChild(card);

    }
  );


  document.getElementById(
    "nextButton"
  ).disabled = true;


  document.getElementById(
    "nextButton"
  ).textContent =
    "決定";

}



/* =====================================================
   決勝終了
===================================================== */

function finishFinalRound() {

  if (
    selectedIds.size !== 1
  ) {

    return;

  }


  /*
  選ばれた1人が勝利
  */

  const winner =
    [...selectedIds][0];


  finalWins.set(
    winner,
    (finalWins.get(winner) || 0) + 1
  );


  finalPairIndex++;


  startFinal();

}



/* =====================================================
   通常画面表示
===================================================== */

function renderActors() {

  const grid =
    document.getElementById(
      "actorGrid"
    );


  grid.className =
    "actor-grid";


  grid.innerHTML = "";


  currentChoices.forEach(
    actor => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "actor-card";


      card.dataset.id =
        actor.id;


      /*
      写真
      */

      const img =
        document.createElement(
          "img"
        );


      img.src =
        actor.image ||
        `https://placehold.co/500x500?text=${encodeURIComponent(actor.name)}`;


      img.alt =
        actor.name;


      /*
      画像が存在しない場合
      プレースホルダーを表示
      */

      img.onerror =
        function() {

          this.src =
            `https://placehold.co/500x500?text=${encodeURIComponent(actor.name)}`;

        };


      /*
      名前
      */

      const name =
        document.createElement(
          "div"
        );


      name.className =
        "actor-name";


      name.textContent =
        actor.name;


      card.appendChild(img);

      card.appendChild(name);


      /*
      タップ
      */

      card.addEventListener(
        "click",
        () => {

          selectActor(
            actor.id
          );

        }
      );


      grid.appendChild(card);

    }
  );


  updateNextButton();

}



/* =====================================================
   俳優を選択
===================================================== */

function selectActor(id) {

  /*
  選択状態をON/OFF
  */

  if (
    selectedIds.has(id)
  ) {

    selectedIds.delete(id);

  } else {

    selectedIds.add(id);

  }


  /*
  見た目を更新
  */

  document
    .querySelectorAll(
      ".actor-card"
    )
    .forEach(card => {

      if (
        selectedIds.has(
          card.dataset.id
        )
      ) {

        card.classList.add(
          "selected"
        );

      } else {

        card.classList.remove(
          "selected"
        );

      }

    });


  updateNextButton();

}



/* =====================================================
   次へボタン
===================================================== */

function updateNextButton() {

  const button =
    document.getElementById(
      "nextButton"
    );


  /*
  必ず1人以上選択
  */

  button.disabled =
    selectedIds.size === 0;

}



/* =====================================================
   次へ
===================================================== */

document
  .getElementById(
    "nextButton"
  )
  .addEventListener(
    "click",
    () => {

      if (
        selectedIds.size === 0
      ) {

        return;

      }


      if (
        currentPhase ===
        "preliminary"
      ) {

        finishPreliminaryRound();

      }


      else if (
        currentPhase ===
        "main"
      ) {

        finishMainRound();

      }


      else if (
        currentPhase ===
        "final"
      ) {

        finishFinalRound();

      }

    }
  );



/* =====================================================
   検索
===================================================== */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    event => {

      const keyword =
        event.target.value
          .trim()
          .toLowerCase();


      const resultBox =
        document.getElementById(
          "searchResults"
        );


      resultBox.innerHTML = "";


      if (
        keyword === ""
      ) {

        return;

      }


      const results =
        actors.filter(
          actor =>
            actor.name
              .toLowerCase()
              .includes(keyword)
        );


      results
        .slice(0, 30)
        .forEach(
          actor => {

            const div =
              document.createElement(
                "div"
              );


            div.className =
              "search-result";


            div.textContent =
              actor.name;


            resultBox.appendChild(
              div
            );

          }
        );

    }
  );



/* =====================================================
   結果
===================================================== */

function showResult() {

  currentPhase =
    "result";


  document.getElementById(
    "gameScreen"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "resultScreen"
  ).classList.remove(
    "hidden"
  );


  /*
  最終ランキング。


  ① 決勝勝利数
  ② 本戦選択回数
  ③ 予選選択回数


  の順。


  「何番目にタップしたか」は
  一切使わない。
  */


  const ranked =
    [...finalCandidates];


  ranked.sort(
    (a, b) => {

      const finalA =
        finalWins.get(
          a.id
        ) || 0;


      const finalB =
        finalWins.get(
          b.id
        ) || 0;


      if (
        finalB !== finalA
      ) {

        return finalB - finalA;

      }


      const mainA =
        mainCounts.get(
          a.id
        ) || 0;


      const mainB =
        mainCounts.get(
          b.id
        ) || 0;


      if (
        mainB !== mainA
      ) {

        return mainB - mainA;

      }


      const prelimA =
        preliminaryCounts.get(
          a.id
        ) || 0;


      const prelimB =
        preliminaryCounts.get(
          b.id
        ) || 0;


      return prelimB - prelimA;

    }
  );


  /*
  TOP9だけ表示
  */

  const top9 =
    ranked.slice(0, 9);


  const ranking =
    document.getElementById(
      "ranking"
    );


  ranking.innerHTML = "";


  top9.forEach(
    (actor, index) => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "rank-item";


      const number =
        document.createElement(
          "div"
        );


      number.className =
        "rank-number";


      number.textContent =
        index + 1;


      const img =
        document.createElement(
          "img"
        );


      img.src =
        actor.image ||
        `https://placehold.co/500x500?text=${encodeURIComponent(actor.name)}`;


      img.alt =
        actor.name;


      img.onerror =
        function() {

          this.src =
            `https://placehold.co/500x500?text=${encodeURIComponent(actor.name)}`;

        };


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "rank-name";


      name.textContent =
        actor.name;


      item.appendChild(
        number
      );


      item.appendChild(
        img
      );


      item.appendChild(
        name
      );


      ranking.appendChild(
        item
      );

    }
  );

}



/* =====================================================
   開始
===================================================== */

loadActors();


</script>
